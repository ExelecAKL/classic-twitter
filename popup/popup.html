<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classic Twitter settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <img
          class="brand-bird"
          src="../assets/twitter-bird.svg"
          width="34"
          height="28"
          alt=""
        >
        <div>
          <h1>Classic Twitter</h1>
          <p>Make X feel like Twitter again.</p>
        </div>
      </header>

      <main>
        <p class="status" id="status" role="status" aria-live="polite">
          Classic Twitter is on in light mode.
        </p>

        <form id="settings-form">
          <fieldset>
            <legend class="section-label">Restoration</legend>

            <label class="setting-row" id="de-elon-row">
              <span class="setting-copy">
                <span class="setting-name">De-Elon mode</span>
                <span class="setting-description" id="de-elon-description">
                  Hide Grok, Premium, subscriptions, and newer X surfaces.
                </span>
              </span>
              <span class="switch">
                <input
                  id="deElon"
                  name="deElon"
                  type="checkbox"
                  aria-describedby="de-elon-description"
                  checked
                >
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>

            <label class="setting-row" id="classic-dark-row">
              <span class="setting-copy">
                <span class="setting-name">Classic dark mode</span>
                <span class="setting-description" id="classic-dark-description">
                  Use Twitter’s old dim navy theme instead of pitch black.
                </span>
              </span>
              <span class="switch">
                <input
                  id="classicDark"
                  name="classicDark"
                  type="checkbox"
                  aria-describedby="classic-dark-description"
                >
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>

            <label class="setting-row setting-row-x" id="get-back-to-x-row">
              <span class="setting-copy">
                <span class="setting-name">Get back to X</span>
                <span class="setting-description" id="get-back-to-x-description">
                  Pause every visual and wording restoration.
                </span>
              </span>
              <span class="switch">
                <input
                  id="getBackToX"
                  name="getBackToX"
                  type="checkbox"
                  aria-describedby="get-back-to-x-description"
                >
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>
          </fieldset>
        </form>
      </main>

      <footer>
        <span class="privacy-dot" aria-hidden="true"></span>
        Settings stay on this browser.
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
