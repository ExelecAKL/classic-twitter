<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classic Twitter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <canvas class="power-wave" id="power-wave" aria-hidden="true"></canvas>
      <header class="masthead">
        <h1>Classic Twitter</h1>
      </header>

      <main>
        <section class="power-panel" aria-labelledby="mode-label">
          <h2 id="mode-label" role="status">Twitter Mode</h2>
          <button class="power-button" id="power-button" type="button" aria-label="Classic Twitter" aria-pressed="true" aria-describedby="power-hint" disabled>
            <span class="power-bezel" aria-hidden="true"></span>
            <span class="power-face" aria-hidden="true">
              <svg class="bird-outline" viewBox="-1.5 -1.5 27 27" fill="none" stroke="currentColor" stroke-width="1.08" stroke-linejoin="round">
                <path d="M23.953 4.57a9.83 9.83 0 0 1-2.825.775 4.93 4.93 0 0 0 2.163-2.723 9.86 9.86 0 0 1-3.127 1.184 4.916 4.916 0 0 0-8.384 4.482A13.95 13.95 0 0 1 1.64 3.162a4.822 4.822 0 0 0-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.9 4.9 0 0 1-2.228-.616v.061a4.923 4.923 0 0 0 3.946 4.827 4.99 4.99 0 0 1-2.212.085 4.936 4.936 0 0 0 4.604 3.417A9.867 9.867 0 0 1 1.17 19.61c-.39 0-.779-.023-1.17-.067a13.94 13.94 0 0 0 7.557 2.209c9.053 0 14.002-7.496 14.002-13.986 0-.209 0-.42-.015-.63A9.935 9.935 0 0 0 24 4.59l-.047-.02z"/>
              </svg>
            </span>
          </button>
          <p class="power-hint" id="power-hint">Press to return to X.</p>
        </section>

        <fieldset class="settings" aria-label="Twitter Mode settings">
          <label class="setting-row setting-row-dark">
            <span class="setting-name">
              <svg class="dark-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.6 15.3A8.55 8.55 0 0 1 9.7 3.4a8.85 8.85 0 1 0 10.9 11.9Z"/>
              </svg>
              Dark mode
            </span>
            <span class="switch">
              <input id="classicDark" type="checkbox" role="switch">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
          <label class="setting-row">
            <span class="setting-copy">
              <span class="setting-name">De-Elon mode</span>
              <span class="setting-description" id="de-elon-description">Hide Grok, Premium, and other newer features.</span>
            </span>
            <span class="switch">
              <input id="deElon" type="checkbox" role="switch" aria-describedby="de-elon-description" checked>
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
        </fieldset>
        <p class="save-error" id="save-error" role="alert"></p>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
